services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: LegoStore
      MYSQL_USER: AuthDemoBackend
      MYSQL_PASSWORD: PASS123
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/LegoStore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: AuthDemoBackend
      SPRING_DATASOURCE_PASSWORD: PASS123
      APP_BASE_URL: http://localhost:8080
      APP_SEED_ENABLED: "true"
      APP_ADMIN_EMAIL: admin@legostore.test
      APP_ADMIN_PASSWORD: change-me-now
      # JWT_SECRET: set a long random value in production
    ports:
      - "8080:8080"

volumes:
  db_data:
