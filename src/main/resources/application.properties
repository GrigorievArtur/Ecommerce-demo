spring.application.name=ECOMMERCE-DEMO

spring.datasource.url=jdbc:mysql://localhost:3306/LegoStore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=AuthDemoBackend
spring.datasource.password=PASS123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernatej
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# Set to true only when debugging SQL; keeps demo/CI logs readable.
spring.jpa.show-sql=false

spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl
spring.freemarker.cache=false
spring.freemarker.settings.url_escaping_charset=UTF-8
spring.freemarker.settings.output_format=HTMLOutputFormat
spring.freemarker.settings.locale=en_US


# App properties
spring.frozen_prices_timeout_hours=1

# Storefront
app.name=LegoStore
app.currency=USD
app.currency-symbol=$
app.base-url=http://localhost:8080

# Delivery: flat rate, waived above the threshold (shared by cart, checkout and confirmation)
app.shipping.free-threshold=75
app.shipping.flat-rate=5.99

# JWT signing secret for /api/**. Override with APP_JWT_SECRET in production.
app.jwt.secret=my-super-secret-key-my-super-secret-key-my-super-secret-key-123

# Demo data (set to false in production once your own catalogue is loaded)
app.seed.enabled=true
app.admin.email=admin@legostore.test
app.admin.password=admin12345

# Payments: 'mock' is the built-in sandbox gateway. Swap in a real provider component
# and change this value (e.g. app.payment.provider=stripe).
app.payment.provider=mock